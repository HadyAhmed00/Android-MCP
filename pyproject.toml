[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "android-mcp"
version = "0.1.0"
description = "Lightweight MCP Server for Android Operating System"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
urls = { Homepage = "https://github.com/HadyAhmed00/Android-MCP" }
keywords = ["android", "mcp", "mobile", "automation"]
authors = [
    { name = "Hady Ahmed", email = "hady.ahmed@example.com" }
]
dependencies = [
    "ipykernel>=6.30.1",
    "mcp>=1.9.3",
    "pillow>=11.2.1",
    "uiautomator2>=3.3.1",
]

[project.scripts]
android-mcp = "main:mcp"

[dependency-groups]
dev = []
